---
layout: page
title: English articles
permalink: /en/
lang: en
---

<div class="posts">
  {% assign english_posts = site.posts | where: "lang", "en" %}
  {% for post in english_posts %}
    <article class="post">
      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read more</a>
    </article>
  {% endfor %}
</div>
